[project]
name = "scanrelay"
version = "0.1.0"
description = "SMTP-to-Microsoft Graph relay for printers, scanners and legacy apps after SMTP AUTH Basic auth retirement"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["aiosmtpd>=1.4", "httpx>=0.27"]

[project.scripts]
scanrelay = "scanrelay.server:main"
scanrelay-check = "scanrelay.check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanrelay"]
